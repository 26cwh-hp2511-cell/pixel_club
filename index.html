<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Rhythm</title>
<style>
:root{color-scheme:dark;--ink:#f8f7ff;--muted:#aba9bd;--panel:#191829cc;--accent:#ff4fa3;--blue:#4ac9ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;font-family:Segoe UI,system-ui,sans-serif;background:#0a0913;color:var(--ink)}.stage{min-height:100vh;display:grid;place-items:center;position:relative;isolation:isolate;background:radial-gradient(circle at 50% 45%,#30234c 0,#161225 38%,#090912 76%)}.stage:before,.stage:after{content:"";position:absolute;inset:-25%;z-index:-1;background:repeating-linear-gradient(125deg,transparent 0 52px,#ffffff08 53px 55px,transparent 56px 112px);transform:rotate(-9deg)}.stage:after{background:radial-gradient(circle,#ff4fa32b 0 2px,transparent 3px) 0 0/72px 72px;opacity:.8;transform:rotate(13deg)}.screen{width:min(520px,calc(100vw - 40px));text-align:center;animation:rise .5s ease both}h1{margin:0 0 42px;font-size:clamp(4rem,12vw,6.8rem);line-height:.8;letter-spacing:-.09em;text-transform:uppercase;text-shadow:5px 5px 0 #ff4fa3,-4px -4px 0 #4ac9ff}.subtitle{margin:-30px 0 38px;color:var(--muted);letter-spacing:.3em;font-size:.7rem;text-transform:uppercase}.menu,.settings-card{display:grid;gap:12px}button,select{font:inherit;color:inherit}.menu button,.back{cursor:pointer;border:1px solid #ffffff24;background:var(--panel);padding:15px 22px;text-transform:uppercase;font-weight:800;letter-spacing:.14em;font-size:1rem;transition:.18s ease}.menu button:hover,.menu button:focus-visible,.back:hover,.back:focus-visible{background:var(--accent);border-color:var(--accent);transform:translateX(8px);outline:0}.corner{position:fixed;bottom:25px;background:#161526d9;border:1px solid #ffffff2a;color:var(--ink)}.news{left:25px;width:48px;height:48px;display:grid;place-items:center;font-size:1.25rem;cursor:pointer}.news:hover{background:var(--blue);color:#0a0913}.version{right:25px;border:0;background:transparent;color:var(--muted);font-size:.72rem;letter-spacing:.08em}.music{position:fixed;top:25px;right:25px;width:48px;height:48px;border-radius:50%;cursor:pointer;font-size:1.15rem}.music.on{border-color:var(--accent);color:var(--accent)}#settings{display:none;text-align:left}#settings.active{display:block}.settings-card{background:#12111fe6;border:1px solid #ffffff22;padding:26px;box-shadow:14px 14px 0 #0004}.settings-card h2{margin:0 0 12px;text-align:center;text-transform:uppercase;letter-spacing:.12em}.section-label{color:var(--muted);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;margin-top:8px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.keybind{min-height:68px;cursor:pointer;border:1px solid #ffffff2b;background:#25223a;font-weight:900;font-size:1.35rem;border-radius:4px}.keybind:hover,.keybind.listening{border-color:var(--blue);color:var(--blue);background:#203447}.language-row{display:flex;justify-content:space-between;align-items:center;gap:18px}select{padding:10px;background:#25223a;border:1px solid #ffffff2b;border-radius:4px}.back{margin-top:10px}.hint{min-height:18px;margin:0;text-align:center;color:var(--blue);font-size:.82rem}.toast{position:fixed;left:50%;bottom:85px;translate:-50%;padding:10px 15px;background:#f8f7ff;color:#11101a;font-weight:700;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@keyframes rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}@media(max-width:450px){h1{font-size:4.2rem}.corner{bottom:15px}.news{left:15px}.version{right:15px}}
</style>
</head>
<body><main class="stage">
<section id="menu" class="screen"><h1>The Rhythm</h1><p class="subtitle" data-i18n="tagline">Feel the beat</p><nav class="menu" aria-label="Main menu"><button data-i18n="play" type="button">Play</button><button id="settingsButton" data-i18n="settings" type="button">Settings</button><button data-i18n="credits" type="button">Credits</button><button id="quitButton" data-i18n="quit" type="button">Quit</button></nav></section>
<section id="settings" class="screen" aria-live="polite"><div class="settings-card"><h2 data-i18n="settings">Settings</h2><div class="section-label" data-i18n="keyBindings">Key Bindings</div><div class="keys" id="keys"></div><p class="hint" id="keyHint"></p><div class="section-label" data-i18n="language">Language</div><div class="language-row"><span data-i18n="displayLanguage">Display language</span><select id="language" aria-label="Display language"><option value="en">English</option><option value="ko">&#54620;&#44397;&#50612;</option></select></div><button class="back" id="backButton" data-i18n="back" type="button">Back</button></div></section>
<button class="corner news" id="newsButton" title="Updates" aria-label="Updates">&#10022;</button><button class="corner music on" id="musicButton" title="Music on" aria-label="Music on">&#9835;</button><small class="corner version">v1.0.0</small><div class="toast" id="toast"></div></main>
<script>
const copy={en:{tagline:'Feel the beat',play:'Play',settings:'Settings',credits:'Credits',quit:'Quit',keyBindings:'Key Bindings',language:'Language',displayLanguage:'Display language',back:'Back',pressKey:'Press a key...',updates:'Updates will be available soon!',musicOn:'Music on',musicOff:'Music off',quitMessage:'Thanks for playing The Rhythm!'},ko:{tagline:'\ub9ac\ub4ec\uc744 \ub290\uaef4\ubcf4\uc138\uc694',play:'\ud50c\ub808\uc774',settings:'\uc124\uc815',credits:'\ud06c\ub808\ub527',quit:'\uc885\ub8cc',keyBindings:'\ud0a4 \ubc14\uc778\ub529',language:'\uc5b8\uc5b4',displayLanguage:'\ud45c\uc2dc \uc5b8\uc5b4',back:'\ub4a4\ub85c',pressKey:'\uc6d0\ud558\ub294 \ud0a4\ub97c \ub204\ub974\uc138\uc694...',updates:'\uc5c5\ub370\uc774\ud2b8 \uc18c\uc2dd\uc740 \uace7 \uacf5\uac1c\ub429\ub2c8\ub2e4!',musicOn:'\uc74c\uc545 \ucf1c\uc9d0',musicOff:'\uc74c\uc545 \uaebc\uc9d0',quitMessage:'The Rhythm\uc744 \ud50c\ub808\uc774\ud574 \uc8fc\uc154\uc11c \uac10\uc0ac\ud569\ub2c8\ub2e4!'}};
let language=localStorage.rhythmLanguage||'en',bindings=JSON.parse(localStorage.rhythmBindings||'["A","S","K","L"]'),listening=null,musicOn=localStorage.rhythmMusic!=='off';const $=s=>document.querySelector(s),t=k=>copy[language][k];function save(){localStorage.rhythmLanguage=language;localStorage.rhythmBindings=JSON.stringify(bindings);localStorage.rhythmMusic=musicOn?'on':'off'}function render(){document.documentElement.lang=language;$('#language').value=language;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));$('#musicButton').classList.toggle('on',musicOn);$('#musicButton').textContent=musicOn?'\u266b':'\u2669';$('#musicButton').title=$('#musicButton').ariaLabel=musicOn?t('musicOn'):t('musicOff');$('#keys').innerHTML='';bindings.forEach((key,index)=>{const b=document.createElement('button');b.className='keybind'+(listening===index?' listening':'');b.textContent=listening===index?'...':key;b.title='Lane '+(index+1);b.onclick=()=>{listening=index;$('#keyHint').textContent=t('pressKey');render()};$('#keys').append(b)})}function toast(message){const e=$('#toast');e.textContent=message;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}$('#settingsButton').onclick=()=>{$('#menu').style.display='none';$('#settings').classList.add('active')};$('#backButton').onclick=()=>{listening=null;$('#settings').classList.remove('active');$('#menu').style.display='block';render()};$('#language').onchange=e=>{language=e.target.value;save();render()};$('#musicButton').onclick=()=>{musicOn=!musicOn;save();render()};$('#newsButton').onclick=()=>toast(t('updates'));$('#quitButton').onclick=()=>toast(t('quitMessage'));window.addEventListener('keydown',e=>{if(listening===null)return;e.preventDefault();if(['Shift','Control','Alt','Meta','CapsLock','Tab'].includes(e.key))return;bindings[listening]=e.key.length===1?e.key.toUpperCase():e.key;listening=null;save();$('#keyHint').textContent='';render()});render();
</script></body></html>
