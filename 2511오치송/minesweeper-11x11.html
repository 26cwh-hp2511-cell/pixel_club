<body>
  <main>
    <h1>지뢰찾기 <span aria-label="11 곱하기 11">11×11</span></h1>
    <p class="sub">빈칸을 열고, 모든 지뢰를 피해 보세요.</p>
    <div class="panel"><span>💣 <b id="mines">20</b></span><button id="reset" aria-label="새 게임">🙂</button><span>⏱ <b id="time">000</b></span></div>
    <p id="status" aria-live="polite">첫 칸은 언제나 안전합니다.</p>
    <div id="board" role="grid" aria-label="지뢰찾기 게임판"></div>
    <p class="help">왼쪽 클릭: 열기 · 오른쪽 클릭: 깃발 <kbd>R</kbd>: 새 게임</p>
  </main>
  <script>
    const SIZE = 11, MINE_COUNT = 20;
    const board = document.querySelector('#board'), minesEl = document.querySelector('#mines');
    const timeEl = document.querySelector('#time'), statusEl = document.querySelector('#status'), reset = document.querySelector('#reset');
    let cells, started, gameOver, flags, seconds, timer;

    function neighbours(i) {
      const row = Math.floor(i / SIZE), col = i % SIZE, result = [];
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const r = row + dr, c = col + dc;
        if ((dr || dc) && r >= 0 && r < SIZE && c >= 0 && c < SIZE) result.push(r * SIZE + c);
      }
      return result;
    }
    function placeMines(safe) {
      const blocked = new Set([safe, ...neighbours(safe)]), spots = [];
      for (let i = 0; i < SIZE * SIZE; i++) if (!blocked.has(i)) spots.push(i);
      for (let n = 0; n < MINE_COUNT; n++) {
        const pick = Math.floor(Math.random() * spots.length);
        cells[spots.splice(pick, 1)[0]].mine = true;
      }
      cells.forEach((cell, i) => cell.count = neighbours(i).filter(j => cells[j].mine).length);
    }
    function start() { if (!started) { started = true; timer = setInterval(() => { seconds++; timeEl.textContent = String(seconds).padStart(3, '0'); }, 1000); } }
    function render(cell) {
      const el = cell.el;
      el.className = 'cell' + (cell.open ? ' open' : '') + (cell.flag ? ' flagged' : '') + (cell.mine && gameOver ? ' mine' : '');
      el.textContent = cell.open ? (cell.mine ? '💣' : cell.count || '') : (cell.flag ? '⚑' : '');
      if (cell.open && cell.count && !cell.mine) el.classList.add('n' + cell.count);
      el.setAttribute('aria-label', cell.open ? (cell.mine ? '지뢰' : `주변 지뢰 ${cell.count}개`) : (cell.flag ? '깃발 표시됨' : '닫힌 칸'));
    }
    function reveal(i) {
      const cell = cells[i];
      if (cell.open || cell.flag || gameOver) return;
      if (!started) { placeMines(i); start(); }
      cell.open = true;
      if (cell.mine) { finish(false); return; }
      if (!cell.count) neighbours(i).forEach(reveal);
      render(cell); checkWin();
    }
    function toggleFlag(i) {
      const cell = cells[i];
      if (cell.open || gameOver) return;
      cell.flag = !cell.flag; flags += cell.flag ? 1 : -1;
      minesEl.textContent = MINE_COUNT - flags; render(cell);
    }
    function finish(won) {
      gameOver = true; clearInterval(timer);
      cells.forEach(cell => { if (cell.mine) cell.open = true; render(cell); });
      reset.textContent = won ? '😎' : '😵';
      statusEl.textContent = won ? '축하합니다! 모든 안전한 칸을 열었습니다.' : '앗, 지뢰를 밟았습니다. 다시 도전해 보세요!';
    }
    function checkWin() { if (cells.filter(c => c.open).length === SIZE * SIZE - MINE_COUNT) finish(true); }
    function newGame() {
      clearInterval(timer); started = gameOver = false; flags = seconds = 0; minesEl.textContent = MINE_COUNT; timeEl.textContent = '000'; reset.textContent = '🙂';
      statusEl.textContent = '첫 칸은 언제나 안전합니다.'; board.innerHTML = '';
      cells = Array.from({ length: SIZE * SIZE }, (_, i) => {
        const el = document.createElement('button'); el.className = 'cell'; el.type = 'button'; el.setAttribute('role', 'gridcell');
        el.addEventListener('click', () => reveal(i)); el.addEventListener('contextmenu', e => { e.preventDefault(); toggleFlag(i); });
        board.append(el); const cell = { el, mine: false, open: false, flag: false, count: 0 }; render(cell); return cell;
      });
    }
    reset.addEventListener('click', newGame); document.addEventListener('keydown', e => { if (e.key.toLowerCase() === 'r') newGame(); }); newGame();
  </script>
